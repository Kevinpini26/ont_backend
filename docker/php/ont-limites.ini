; Limites d'envoi alignées avec nginx (docker/nginx.conf : client_max_body_size) et Laravel
; (fichier unique : 10 Mo pour les scans et rapports, 5 Mo pour les pièces jointes courantes).
; Règle : nginx >= post_max_size >= upload_max_filesize >= plus gros fichier accepté par Laravel.
upload_max_filesize = 12M
post_max_size = 64M
max_file_uploads = 25
memory_limit = 256M
