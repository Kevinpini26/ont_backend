; Limites d'envoi alignées avec nginx (docker/nginx.conf : client_max_body_size) et Laravel
; (fichier unique : jusqu'à 20 Mo pour les numérisations de dossiers stagiaires, 15 Mo pour les scans
; officiels de courrier, 10 Mo pour les rapports, 5 Mo pour les pièces jointes courantes).
; Règle : nginx >= post_max_size >= upload_max_filesize >= plus gros fichier accepté par Laravel.
upload_max_filesize = 21M
post_max_size = 64M
max_file_uploads = 25
memory_limit = 256M
